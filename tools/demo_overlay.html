<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Secret Mail — overlay trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<!-- Lapisan motion-graphic trailer: transparan, murni fungsi waktu (Overlay.frame(t)).
     Ditempel di atas rekaman gameplay oleh ffmpeg.

     PRINSIP DESAIN (versi tenang, bukan penuh tempelan):
     - gameplay adalah bintangnya: area gambar (74..646) dibiarkan hampir bersih
     - semua teks tinggal DI DALAM bar letterbox atas & bawah, bukan menimpa gambar
     - satu pesan per baris, tidak ada kotak/panel bertumpuk
     - aksen emas tipis sebagai pemersatu -->
<canvas id="ov" width="1280" height="720"></canvas>
<canvas id="game" width="1" height="1" style="display:none"></canvas>
<canvas id="ui" width="1" height="1" style="display:none"></canvas>
<script src="../js/engine.js"></script>
<script>
'use strict';
const g = document.getElementById('ov').getContext('2d');
const OW = 1280, OH = 720;
const BAR = 74;                       // tinggi bar letterbox atas & bawah
const SAFE_IN = 64;                   // margin teks di dalam bar
let TL = null;
window.setTimeline = tl => { TL = tl; };

const PS = s => s + 'px "Press Start 2P", monospace';
const VT = s => s + 'px "VT323", monospace';
const GOLD = '#e8c04a', GOLD_HI = '#fff2cc', IVORY = '#f2ecdf', MUTED = 'rgba(206,200,232,0.82)', RED = '#c8503e';

function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function txt(str, x, y, o = {}) {
  const { font = VT(30), color = IVORY, align = 'left', alpha = 1, baseline = 'middle' } = o;
  g.save(); g.globalAlpha = alpha; g.font = font; g.textAlign = align; g.textBaseline = baseline;
  g.fillStyle = color; g.fillText(str, x, y); g.restore();
}
const fade = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const ease = easeOutCubic;
const easeBack = easeOutBack;
const segAt = (t) => TL ? TL.segments.find(s => t >= s.t0 && t <= s.t0 + s.dur) : null;
const localOf = (s, t) => t - s.t0;

/* ---------- bar letterbox + garis emas + progres tipis ---------- */
function bars(t, dur) {
  const p = ease(Math.min(1, t / 0.5)) * (1 - fade(t, dur - 0.5, dur));
  if (p <= 0.01) return;
  const h = Math.round(BAR * p);
  rect(0, 0, OW, h, 'rgba(7,6,16,0.95)');
  rect(0, OH - h, OW, h, 'rgba(7,6,16,0.95)');
  rect(0, h - 1, OW, 1, 'rgba(232,192,74,0.30)');
  rect(0, OH - h, OW, 1, 'rgba(232,192,74,0.30)');
  // progres: garis emas tipis di dalam bar bawah
  const pr = Math.min(1, t / dur);
  rect(SAFE_IN, OH - 12, OW - SAFE_IN * 2, 1, 'rgba(255,255,255,0.10)');
  rect(SAFE_IN, OH - 12, (OW - SAFE_IN * 2) * pr, 1, 'rgba(232,192,74,0.75)');
}
/* tirai piksel di peralihan babak */
function wipes(t) {
  if (!TL) return;
  for (const b of TL.boundaries) {
    const p = (t - b) / 0.5;
    if (p < 0 || p > 1) continue;
    const CW = 40, n = Math.ceil(OW / CW);
    for (let i = 0; i < n; i++) {
      const jit = hash2(i * 7 + b * 100, 3) * 0.4;
      const q = Math.max(0, Math.min(1, (p - jit) / (1 - jit + 1e-6)));
      const h = Math.round(q * OH);
      if (h <= 0) continue;
      rect(i * CW, OH - h, CW, h, 'rgba(8,6,20,0.97)');
      rect(i * CW, OH - h, CW - 4, 2, `rgba(232,192,74,${(0.8 * q).toFixed(2)})`);
    }
  }
}

/* ---------- isi bar: label babak (bawah) + satu baris keterangan (atas) ---------- */
function chapter(s, t, local) {
  const din = ease(fade(local, 0.15, 0.5));
  const dout = 1 - fade(local, s.dur - 0.35, s.dur - 0.05);
  const a = Math.min(din, dout);
  if (a <= 0) return;
  // bar bawah: "01  TEMUKAN BUKTI" (rata kiri, rapat)
  txt(s.num || '', SAFE_IN, OH - 42, { font: PS(15), color: s.accent || GOLD, alpha: a });
  txt(s.head || '', SAFE_IN + 58, OH - 42, { font: PS(15), color: IVORY, alpha: a });
  // bar atas: satu baris keterangan
  const ca = a * fade(local, 0.35, 0.75);
  if (ca > 0 && s.sub) txt(s.sub, SAFE_IN, BAR / 2 + 1, { font: VT(31), color: MUTED, alpha: ca });
}

/* ---------- penanda objek: satu cincin tipis + label kecil ---------- */
function marker(m, t, local) {
  if (!m) return;
  const a = Math.min(fade(local, m.t || 1, (m.t || 1) + 0.4), 1 - fade(local, m.until || 4, (m.until || 4) + 0.35));
  if (a <= 0) return;
  const x = m.x * 2, y = m.y * 2;
  const pulse = 1 + 0.07 * Math.sin(t * 5);
  g.save();
  g.globalAlpha = a * 0.95;
  g.strokeStyle = m.c || GOLD;
  g.lineWidth = 2;
  g.beginPath(); g.arc(x, y, 26 * pulse, 0, Math.PI * 2); g.stroke();
  g.restore();
  txt(m.label || '', x, y - 40, { font: PS(11), color: m.c || GOLD, align: 'center', alpha: a });
}

/* ---------- HOOK: dua baris, bersih tanpa garis glitch ---------- */
function hook(s, t) {
  const p = fade(t, s.t0 + 0.05, s.t0 + 0.35);
  if (p <= 0) return;
  // latar diredam dulu (poster, bukan tulisan menempel di atas gameplay),
  // lalu semburat merah di tepi
  const dim = 0.62 * p;
  g.fillStyle = `rgba(10,3,6,${dim.toFixed(3)})`;
  g.fillRect(0, 0, OW, OH);
  const gv = g.createRadialGradient(OW / 2, OH / 2, OH * 0.30, OW / 2, OH / 2, OH * 0.95);
  gv.addColorStop(0, 'rgba(0,0,0,0)');
  gv.addColorStop(1, `rgba(150,26,20,${0.5 * p})`);
  g.fillStyle = gv; g.fillRect(0, 0, OW, OH);
  (s.lines || []).forEach((ln, i) => {
    const lp = Math.max(0, Math.min(1, (t - s.t0 - 0.15 - i * 0.5) / 0.25));
    if (lp <= 0) return;
    const e = easeBack(lp);
    const y = OH / 2 - 26 + i * 86;
    g.save();
    g.translate(OW / 2, y);
    g.scale(0.94 + 0.06 * e, 0.94 + 0.06 * e);
    txt(ln, 0, 0, { font: PS(46), color: i ? GOLD_HI : IVORY, align: 'center', alpha: lp });
    g.restore();
    if (i === 0) rect(OW / 2 - 150 * e, y + 26, 300 * e, 3, RED);
  });
}

/* ---------- LOGO (dipakai kartu judul & end card) ---------- */
function logo(t, x, y, size, alpha) {
  const text = 'SECRET MAIL', sp = size * 0.16;
  g.save(); g.font = PS(size); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const adv = []; let total = 0;
  for (const ch of text) { const w = g.measureText(ch).width; adv.push(w); total += w + sp; }
  total -= sp;
  let cx = Math.round(x - total / 2);
  const bloom = g.createRadialGradient(x, y - size * 0.4, 10, x, y - size * 0.4, 420);
  bloom.addColorStop(0, `rgba(232,192,74,${0.14 * alpha})`);
  bloom.addColorStop(1, 'rgba(232,192,74,0)');
  g.fillStyle = bloom; g.fillRect(x - 440, y - 230, 880, 350);
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch !== ' ') {
      const metal = g.createLinearGradient(0, y - size + 4, 0, y + 3);
      metal.addColorStop(0, GOLD_HI); metal.addColorStop(0.35, '#ffe9a8');
      metal.addColorStop(0.62, GOLD); metal.addColorStop(1, '#96701a');
      g.globalAlpha = alpha;
      g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillText(ch, cx + 2, y + 3);
      g.fillStyle = metal; g.fillText(ch, cx, y);
      g.globalAlpha = alpha * 0.16; g.fillStyle = '#fffdf2'; g.fillText(ch, cx, y - 2);
      g.globalAlpha = 1;
    }
    cx += adv[i] + sp;
  }
  g.restore();
}

function titleCard(s, t) {
  const a = Math.min(fade(t, s.t0 + 0.1, s.t0 + 0.9), 1 - fade(t, s.t0 + s.dur - 0.35, s.t0 + s.dur));
  if (a <= 0) return;
  // gameplay diredam gelap dulu, supaya tulisan judul tidak bertabrakan dengan
  // HUD/objek di belakangnya
  const gr = g.createLinearGradient(0, 0, 0, OH);
  gr.addColorStop(0, `rgba(8,7,20,${0.88 * a})`);
  gr.addColorStop(1, `rgba(18,13,38,${0.92 * a})`);
  g.fillStyle = gr; g.fillRect(0, 0, OW, OH);
  const y = OH / 2 - 4;
  logo(t, OW / 2, y, 52, a);
  const rp = ease(fade(t, s.t0 + 0.55, s.t0 + 1.15));
  rect(OW / 2 - 250 * rp, y + 26, 500 * rp, 2, `rgba(232,192,74,${0.5 * a})`);
  txt('PETUALANGAN ENKRIPSI RAHASIA', OW / 2, y + 62, { font: VT(34), color: MUTED, align: 'center', alpha: a });
}

/* ---------- END CARD: bersih, rapat, satu kolom ---------- */
function endcard(s, t, local) {
  const p = fade(local, 0.1, 0.8);
  if (p <= 0) return;
  const gr = g.createLinearGradient(0, 0, 0, OH);
  gr.addColorStop(0, `rgba(8,7,20,${0.90 * p})`);
  gr.addColorStop(1, `rgba(20,14,42,${0.94 * p})`);
  g.fillStyle = gr; g.fillRect(0, 0, OW, OH);
  logo(t, OW / 2, 178, 52, p);
  rect(OW / 2 - 250, 206, 500, 2, `rgba(232,192,74,${0.35 * p})`);
  txt('PETUALANGAN ENKRIPSI RAHASIA', OW / 2, 238, { font: VT(34), color: MUTED, align: 'center', alpha: p });
  // tiga poin fitur, satu kolom rapi (tanpa wajik di setiap baris)
  (s.bullets || []).forEach((b, i) => {
    const bp = ease(fade(local, 0.9 + i * 0.26, 1.2 + i * 0.26));
    if (bp <= 0) return;
    txt(b, OW / 2 - 300, 320 + i * 52, { font: VT(34), color: IVORY, alpha: bp });
  });
  const cp = ease(fade(local, 2.5, 3.0));
  if (cp > 0) {
    txt(s.cta || 'COBA SEKARANG', OW / 2, OH - 176, { font: PS(19), color: GOLD_HI, align: 'center', alpha: cp });
  }
  txt(s.url || '', OW / 2, OH - 128, { font: VT(30), color: MUTED, align: 'center', alpha: ease(fade(local, 3.0, 3.5)) });
}

/* ---------- FRAME ---------- */
function frameAt(t) {
  g.clearRect(0, 0, OW, OH);
  if (!TL) return;
  const s = segAt(t);
  if (s) {
    const local = localOf(s, t);
    if (s.kind === 'hook') hook(s, t);
    else if (s.kind === 'title') titleCard(s, t);
    else if (s.kind === 'shot') { chapter(s, t, local); marker(s.marker, t, local); }
    else if (s.kind === 'endcard') endcard(s, t, local);
  }
  bars(t, TL.dur);
  wipes(t);
}
window.Overlay = { frame: frameAt, OW, OH };

/* ---------- AUDIO: musik chiptune + SFX game, dirender offline ---------- */
window.renderAudio = async () => {
  const sr = 44100, dur = TL.dur + 0.4;
  const off = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  const master = off.createGain(); master.gain.value = 0.6; master.connect(off.destination);
  const realCtx = Snd.ctx, realMaster = Snd.master, realMuted = Snd.muted;
  Snd.ctx = off; Snd.master = master; Snd.muted = false;
  const tone0 = Snd.tone, noise0 = Snd.noise;
  let offset = 0;
  Snd.tone = (f, o = {}) => tone0.call(Snd, f, Object.assign({}, o, { when: (o.when || 0) + offset }));
  Snd.noise = (d = .15, v = .06, when = 0) => noise0.call(Snd, d, v, when + offset);
  try {
    TL.music.forEach(m => {
      const pat = Music.defs[m.pat] || Music.defs.title;
      const steps = Math.ceil(m.dur / pat.dur);
      for (let k = 0; k < steps; k++) {
        const when = m.t0 + k * pat.dur;
        if (when > TL.dur) break;
        offset = 0;
        const n = pat.notes[k % pat.notes.length];
        tone0.call(Snd, pat.base * Math.pow(2, n / 12), { d: pat.dur * .85, type: pat.type, v: pat.v * (m.vol || 1), when });
        if (k % 4 === 0) tone0.call(Snd, pat.base / 2, { d: pat.dur * 1.7, type: 'sine', v: pat.v * 1.5 * (m.vol || 1), when });
      }
    });
    TL.cues.forEach(c => {
      offset = c.t;
      const a = c.v === undefined ? 1 : c.v;
      switch (c.k) {
        case 'impact':
          Snd.tone(70, { d: .6, v: .16 * a, type: 'sine', slide: -30 });
          Snd.noise(.28, .1 * a);
          Snd.tone(160, { d: .3, v: .1 * a, type: 'sawtooth', slide: -90 });
          break;
        case 'whoosh': Snd.noise(.26, .07 * a); break;
        case 'chime': [880, 1108, 1318, 1760].forEach((f, i) => Snd.tone(f, { d: .18, v: .085 * a, type: 'triangle', when: i * .09 })); break;
        case 'riser':
          for (let i = 0; i < 8; i++) Snd.tone(220 + i * 55, { d: .22, v: .05 * a, type: 'triangle', when: i * .1 });
          break;
        case 'alert': Snd.tone(960, { d: .1, v: .1 * a }); Snd.tone(720, { d: .12, v: .09 * a, when: .12 }); break;
        case 'tick': Snd.tone(1040, { d: .03, v: .035 * a }); break;
        case 'star': Snd.tone(660 + (c.i || 0) * 220, { d: .2, v: .1 * a, type: 'triangle' }); break;
        case 'sparkle': Snd.tone(1560, { d: .08, v: .05 * a, type: 'triangle' }); Snd.tone(2080, { d: .1, v: .04 * a, type: 'triangle', when: .05 }); break;
        case 'fanfare': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => Snd.tone(f, { d: .16, v: .095 * a, type: 'square', when: i * .11 })); break;
        case 'machine': Snd.tone(180, { d: 1.3, v: .05 * a, type: 'triangle', slide: 720 }); break;
        case 'paper': Snd.noise(.12, .05 * a); Snd.tone(240, { d: .06, v: .04 * a, type: 'triangle' }); break;
        case 'door': Snd.tone(140, { d: .18, v: .1 * a, type: 'triangle', slide: -60 }); Snd.noise(.1, .04 * a); break;
        case 'type': for (let i = 0; i < 14; i++) Snd.tone(980, { d: .03, v: .03 * a, when: i * .07 }); break;
      }
    });
  } finally {
    Snd.tone = tone0; Snd.noise = noise0;
  }
  const buf = await off.startRendering();
  Snd.ctx = realCtx; Snd.master = realMaster; Snd.muted = realMuted;
  const ch = buf.numberOfChannels, len = buf.length, bytes = 44 + len * ch * 2;
  const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wr(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); wr(8, 'WAVE'); wr(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true);
  dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
  wr(36, 'data'); dv.setUint32(40, len * ch * 2, true);
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < ch; c++) {
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7FFF, true); o += 2;
    }
  }
  const u8 = new Uint8Array(ab);
  let bin = '';
  for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(bin);
};

/* ---------- pemeriksaan kepadatan & kesesuaian lebar teks ---------- */
window.coverStats = () => {
  const cv = document.getElementById('ov');
  const d = cv.getContext('2d').getImageData(0, 0, OW, OH).data;
  let n = 0, tot = 0, minx = 1e9, maxx = -1, miny = 1e9, maxy = -1;
  for (let y = BAR + 2; y < OH - BAR - 2; y += 2) {
    for (let x = 0; x < OW; x += 2) {
      tot++;
      if (d[(y * OW + x) * 4 + 3] > 140) {
        n++;
        if (x < minx) minx = x; if (x > maxx) maxx = x;
        if (y < miny) miny = y; if (y > maxy) maxy = y;
      }
    }
  }
  return { frac: n / tot, n: n, minx: minx, maxx: maxx, miny: miny, maxy: maxy };
};

/* lebar tiap teks supaya bisa dipastikan tidak melewati bar / keluar layar */
window.textFit = () => {
  const out = {};
  if (!TL) return out;
  const avail = OW - SAFE_IN * 2;
  g.save();
  TL.segments.forEach(s => {
    if (s.sub) { g.font = VT(31); out[s.name + ' sub'] = [Math.round(g.measureText(s.sub).width), avail]; }
    if (s.head) { g.font = PS(15); out[s.name + ' head'] = [Math.round(g.measureText((s.num || '') + '     ' + s.head).width), avail]; }
    (s.bullets || []).forEach((b, i) => { g.font = VT(34); out[s.name + ' bullet' + i] = [Math.round(g.measureText(b).width), OW - 2 * (OW / 2 - 300)]; });
    if (s.url) { g.font = VT(30); out[s.name + ' url'] = [Math.round(g.measureText(s.url).width), avail]; }
    if (s.cta) { g.font = PS(19); out[s.name + ' cta'] = [Math.round(g.measureText(s.cta).width), avail]; }
  });
  g.restore();
  return out;
};

window.assetsReady = false;
window.__err = null;
addEventListener('error', e => { window.__err = (e && e.message) || 'error'; });
const mark = () => { window.assetsReady = true; };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(mark);
setTimeout(mark, 3000);
</script>
</body>
</html>
